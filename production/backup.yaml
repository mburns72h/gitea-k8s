---
# Nightly gitea backup -> Synology (/volume8/OCP/gitea-prod-backup)
#
# Uses the native `gitea dump`, which packs repositories, the database and the
# configuration into a single archive with a documented restore path. This is
# the only backup of the Git repositories themselves: the pgBackRest repo
# (/volume8/OCP/gitea-prod-pg-backup) covers only the database, i.e. users,
# issues, PRs and settings. Restoring that alone yields a working Gitea with no
# code in it - including the loss of homelab/argocd-apps, which defines the
# GitOps deployment.
#
# The Synology directory must already exist, owned by the UID gitea runs as:
#   /volume8/OCP/gitea-prod-backup  ->  drwx------  1000830000:root
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-prod-backup-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=3
  nfs:
    server: diskstation.home.mburnsfire.net
    path: /volume8/OCP/gitea-prod-backup
  claimRef:
    namespace: gitea
    name: gitea-prod-backup

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-prod-backup
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: gitea-prod-backup-pv

---
# Dedicated identity for the backup job, kept separate from the `gitea` SA so
# the scale permission is not granted to the application itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-backup
  namespace: gitea

---
# The dump runs with Gitea stopped, so the job needs to scale the Deployment
# down and back up. Scoped to exactly that verb on that resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-backup-scaler
  namespace: gitea
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-backup-scaler
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-backup-scaler
subjects:
  - kind: ServiceAccount
    name: gitea-backup
    namespace: gitea

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-backup
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: backup
spec:
  # 03:00 - after the pgBackRest window (01:00) and before npm (04:00).
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Bound the run so a hang cannot leave Gitea scaled down indefinitely.
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: gitea-backup
          restartPolicy: Never
          securityContext:
            runAsUser: 1000830000
            runAsGroup: 0
          containers:
            - name: backup
              # The gitea image itself: provides the `gitea` binary, and matches
              # the running version so the dump format is always consistent.
              # Pulled via the in-cluster ImageStream, same as the Deployment.
              image: image-registry.openshift-image-registry.svc:5000/gitea/gitea:stable-rootless
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  REPLICAS=3
                  NS=gitea
                  DEPLOY=gitea
                  API=https://kubernetes.default.svc
                  SA=/var/run/secrets/kubernetes.io/serviceaccount

                  # The gitea image ships neither kubectl nor oc, so scaling is
                  # done straight against the API with the ServiceAccount token.
                  scale_to() {
                    curl -sS -f \
                      --cacert "${SA}/ca.crt" \
                      -H "Authorization: Bearer $(cat ${SA}/token)" \
                      -H "Content-Type: application/merge-patch+json" \
                      -X PATCH \
                      -d "{\"spec\":{\"replicas\":$1}}" \
                      "${API}/apis/apps/v1/namespaces/${NS}/deployments/${DEPLOY}/scale" \
                      >/dev/null
                  }

                  running_pods() {
                    curl -sS -f \
                      --cacert "${SA}/ca.crt" \
                      -H "Authorization: Bearer $(cat ${SA}/token)" \
                      "${API}/api/v1/namespaces/${NS}/pods?labelSelector=app.kubernetes.io%2Fname%3Dgitea" \
                      | grep -c '"phase"' || true
                  }

                  # Counts pods where the whole pod (all init + main containers)
                  # is ready, via the pod-level "Ready" condition - NOT a count
                  # of individual "ready":true fields. Each gitea pod has 3 init
                  # containers plus the main container, all of which report
                  # ready:true once healthy, so a single fully-ready pod produces
                  # 4 such matches, not 1 - counting those directly can never
                  # reliably equal "1" and made this check meaningless in
                  # practice. The Ready condition is exactly one bool per pod.
                  #
                  # No -f here (unlike scale_to/running_pods): we want the
                  # response body and status even on a non-2xx, so a genuine
                  # API/curl failure during the wait loop is distinguishable
                  # from "pod legitimately not ready yet" instead of both
                  # silently collapsing to the same "0". Hit 2026-08-16/17:
                  # two nights running, the first backup attempt reported 0/1
                  # for the full 5m even though the pod's own Ready condition
                  # timestamp shows it became ready in ~20s - root cause not
                  # yet identified, this diagnostic line is what's needed to
                  # tell curl-failure vs. genuinely-slow-pod apart next time.
                  ready_pods() {
                    # Explicit template pointing at /stage (this job's own
                    # mounted scratch volume) rather than relying on
                    # mktemp's default tmpdir resolution - that failed here
                    # with "mktemp: : No such file or directory" (empty
                    # path), busybox mktemp/TMPDIR behavior differs from
                    # GNU mktemp and isn't safe to assume.
                    resp=$(mktemp /stage/ready_pods.XXXXXX)
                    # set +e around the curl call: a connection-level failure
                    # (as opposed to a non-2xx HTTP status, which curl without
                    # -f treats as success) must not trip `set -e` and kill
                    # the whole script mid-wait-loop - we need to observe and
                    # log it, not have the script die silently on it.
                    set +e
                    http_status=$(curl -sS -o "${resp}" -w '%{http_code}' \
                      --cacert "${SA}/ca.crt" \
                      -H "Authorization: Bearer $(cat ${SA}/token)" \
                      "${API}/api/v1/namespaces/${NS}/pods?labelSelector=app.kubernetes.io%2Fname%3Dgitea")
                    curl_rc=$?
                    set -e
                    # THE root cause (found 2026-08-17 via live testing,
                    # not guessed): the API server pretty-prints its JSON
                    # response for a bare `curl` with no special headers
                    # (differs from `oc`/kubectl, which negotiate compact
                    # JSON and never hit this) - real captured response
                    # looks like `"type": "Ready",\n  "status": "True"`,
                    # each field on its own line, WITH a space after the
                    # colon. grep matches line-by-line by default, so a
                    # pattern expecting both on one compact line can NEVER
                    # match, regardless of actual pod state - confirmed
                    # live: the deployed (pre-fix) check reported 0/1 for
                    # a full 5m against a pod independently confirmed
                    # Ready=True the whole time. `tr -d '\n'` flattens the
                    # response first; `[[:space:]]*` after each colon
                    # tolerates the pretty-printer's space. `[^}]*` still
                    # scopes the match to a single condition object (stops
                    # at its closing brace) even once flattened, so this
                    # can't accidentally span into a different condition
                    # or a different pod's entry.
                    #
                    # grep also exits 1 on zero matches - the normal case
                    # on every poll before the pod is ready - and under
                    # pipefail that makes this assignment "fail" too,
                    # which set -e then treats as fatal: killed the script
                    # silently on the very first not-ready poll, before
                    # even reaching the diag echo below. The `|| true` is
                    # not optional.
                    count=$(tr -d '\n' < "${resp}" | grep -o '"type":[[:space:]]*"Ready"[^}]*"status":[[:space:]]*"True"' | wc -l || true)
                    echo "  [diag] curl_rc=${curl_rc} http_status=${http_status} body_bytes=$(wc -c < "${resp}") ready_matches=${count}" >&2
                    rm -f "${resp}"
                    echo "${count}"
                  }

                  # Whatever happens after this point - success, failure, or a
                  # bad exit from `gitea dump` - Gitea gets scaled back up.
                  # Argo will NOT restore it for us: the gitea-prod Application
                  # explicitly ignores /spec/replicas.
                  #
                  # Scaling straight to REPLICAS brings all pods up at once,
                  # and their init containers race to write the shared
                  # app.ini on gitea-shared-storage - the loser(s) boot with
                  # no/incomplete config and serve the install wizard instead
                  # of the app (seen 2026-08-03). Bringing up a single pod
                  # first, with no other pod's init containers writing
                  # app.ini concurrently, guarantees that one gets a clean
                  # config before the rest join.
                  restore_replicas() {
                    echo "Restoring gitea replicas one by one to avoid concurrent app.ini writes ..."
                    for target in $(seq 1 "${REPLICAS}"); do
                      echo "Scaling gitea to ${target} replica(s) ..."
                      scale_to "${target}" || { echo "WARNING: scale-up to ${target} failed, gitea may be degraded"; return; }
                      target_ready=""
                      for i in $(seq 1 60); do
                        n=$(ready_pods)
                        if [ "${n}" = "${target}" ]; then
                          target_ready=1
                          break
                        fi
                        echo "  waiting for pod(s) to become ready (${n}/${target}) ..."
                        sleep 5
                      done
                      if [ -z "${target_ready}" ]; then
                        echo "ERROR: ${target} pod(s) never became ready after 5m - refusing to scale further. Gitea is left at ${target} replica(s); investigate before scaling up manually." >&2
                        exit 1
                      fi
                    done
                    echo "Restoration to ${REPLICAS} replicas complete."
                  }
                  trap restore_replicas EXIT

                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  ARCHIVE="/backup/gitea-dump-${TIMESTAMP}.zip"

                  echo "Scaling gitea down for a consistent dump ..."
                  scale_to 0
                  for i in $(seq 1 60); do
                    n=$(running_pods)
                    [ "${n}" = "0" ] && break
                    echo "  waiting for ${n} pod(s) to terminate ..."
                    sleep 5
                  done

                  echo "Running gitea dump ..."
                  # --skip-log drops actions_log, which is ~6.5MB of the 8MB
                  # total and is disposable.
                  gitea dump \
                    --config /data/gitea/conf/app.ini \
                    --file "${ARCHIVE}.tmp" \
                    --tempdir /stage \
                    --skip-log

                  # Rename only once the dump has completed, so a partial file
                  # can never be mistaken for a usable backup.
                  mv "${ARCHIVE}.tmp" "${ARCHIVE}"

                  echo "Pruning archives older than 30 days ..."
                  find /backup -name 'gitea-dump-*.zip' -mtime +30 -delete
                  find /backup -name 'gitea-dump-*.zip.tmp' -mtime +1 -delete

                  echo "Current backups:"
                  ls -lh /backup
                  echo "Backup complete"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
                - name: stage
                  mountPath: /stage
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: gitea-shared-storage
            - name: backup
              persistentVolumeClaim:
                claimName: gitea-prod-backup
            # Scratch space for `gitea dump` to assemble the archive.
            - name: stage
              emptyDir:
                sizeLimit: 2Gi
