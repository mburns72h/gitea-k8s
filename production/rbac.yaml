---
# anyuid required for init container to chown NFS-mounted /data volume
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-anyuid
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: gitea
  namespace: gitea
---
# Lets cert-management (separate "cert-management" namespace) write the
# copied *.home.mburnsfire.net cert Secret into this namespace. Co-located
# here (not centralized in cert-management's own rbac.yaml) since it's a
# namespace-local grant specific to this app. See
# docs/PLAN_npm_migration.md in homelab/cert-management for the full
# cross-namespace design.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-management-write-home-cert
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["home-mburnsfire-net-tls"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-management-write-home-cert
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-management-write-home-cert
subjects:
  - kind: ServiceAccount
    name: cert-management
    namespace: cert-management
---
# Lets the OpenShift router read the copied Secret for this namespace's
# Route(s) to use via spec.tls.externalCertificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-home-cert
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["home-mburnsfire-net-tls"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-home-cert
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-home-cert
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
---
# Patroni's Kubernetes-DCS leader election writes its pod's own IP into a plain
# Endpoints object (gitea-postgres-ha); OpenShift's RestrictedEndpointsAdmission
# rejects that write ("endpoint address ... is not allowed") unless the writer can
# use the virtual endpoints/restricted subresource, which the Postgres Operator's
# own generated RBAC for gitea-postgres-instance never grants. This only surfaces
# when a Postgres pod gets a brand-new IP (i.e. almost never, until a full
# simultaneous cluster reboot forces every pod to re-register at once) -- found
# 2026-11-05 during post-maintenance bring-up, when it took the whole app down.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-postgres-instance-endpoints-restricted
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["endpoints/restricted"]
    verbs: ["create", "update"]
    resourceNames: ["gitea-postgres-ha"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-postgres-instance-endpoints-restricted
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-postgres-instance-endpoints-restricted
subjects:
  - kind: ServiceAccount
    name: gitea-postgres-instance
    namespace: gitea
